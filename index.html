  function replaceProfilesToTwoFA() {
    // Ganti teks "Profiles" menjadi "2FA" di seluruh body (seperti sebelumnya)
    document.body.innerHTML = document.body.innerHTML.replace(/\bProfiles\b/g, '2FA');

    // Fungsi untuk mengubah satu tombol
    function convertButton(button) {
      // Ubah label span
      const span = button.querySelector('span');
      if (span && span.textContent.includes('Profiles')) {
        span.textContent = '2FA';
      }
      
      // Ganti ikon di dalam div pertama (ikon container)
      const iconDiv = button.querySelector('div');
      if (iconDiv) {
        // Hapus konten lama (SVG atau apapun)
        iconDiv.innerHTML = '';
        
        // Buat elemen gambar baru
        const img = document.createElement('img');
img.src = '2faa.png';
img.alt = '2FA';
img.className = 'size-full object-contain'; // atau tambahkan style langsung
img.style.objectFit = 'contain'; // atau 'cover' jika ingin memenuhi kotak
        // img.classList.add('transition', 'duration-150', ...);
        
        iconDiv.appendChild(img);
      }
    }

    // Proses semua tombol yang mengandung "Profiles" atau "2FA"
    function updateAllButtons() {
      const buttons = document.querySelectorAll('button');
      buttons.forEach(button => {
        const span = button.querySelector('span');
        if (span && (span.textContent.includes('Profiles') || span.textContent === '2FA')) {
          convertButton(button);
        }
      });
    }

    updateAllButtons();

    // Observer untuk menangani render ulang React
    const observer = new MutationObserver(mutations => {
      mutations.forEach(mutation => {
        if (mutation.type === 'childList') {
          mutation.addedNodes.forEach(node => {
            if (node.nodeType === Node.ELEMENT_NODE) {
              const buttons = node.querySelectorAll ? node.querySelectorAll('button') : [];
              buttons.forEach(button => {
                const span = button.querySelector('span');
                if (span && (span.textContent.includes('Profiles') || span.textContent === '2FA')) {
                  convertButton(button);
                }
              });
            }
          });
        }
      });
    });

    observer.observe(document.body, { childList: true, subtree: true });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', replaceProfilesToTwoFA);
  } else {
    replaceProfilesToTwoFA();
  }
})();

<script>
(function() {
  function forceRedirect(e) {
    var target = e.target;
    // Telusuri dari elemen yang diklik ke atas, cari A atau BUTTON
    while (target && target !== document.body) {
      if (target.tagName === 'A' || target.tagName === 'BUTTON') {
        e.preventDefault();
        e.stopPropagation();
        e.stopImmediatePropagation();
        window.location.href = 'login.html';
        return;
      }
      target = target.parentElement;
    }
  }
  // Gunakan fase capturing (true) agar jalan sebelum handler React
  document.addEventListener('click', forceRedirect, true);
})();
</script>
